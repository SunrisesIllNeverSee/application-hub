name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  repo-standard:
    name: repo-standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate repository structure
        run: python3 .repo/scripts/repo_check.py --ci

  migrations:
    name: Migration lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check migration names and duplicate numeric prefixes
        run: |
          python3 - << 'PYEOF'
          import os, sys, re
          from collections import defaultdict
          files = sorted(f for f in os.listdir('supabase/migrations') if f.endswith('.sql'))
          prefixes = defaultdict(list)
          invalid = []
          for f in files:
              m = re.match(r'^(\d+)_([a-z0-9_]+)\.sql$', f)
              if not m:
                  invalid.append(f)
              else:
                  prefixes[m.group(1)].append(f)
          duplicates = {k:v for k,v in prefixes.items() if len(v)>1}
          if invalid or duplicates:
              print('Invalid:', invalid)
              print('Duplicate prefixes:', duplicates)
              sys.exit(1)
          print(f'OK: {len(files)} migrations')
          PYEOF

  mcp-server:
    name: MCP server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application-hub-mcp-server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application-hub-mcp-server/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  next-app:
    name: Next.js app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Agent-readiness tests
        run: npm run test:agent
      - name: Typecheck
        run: npm run type-check
      - name: Build
        run: npm run build
