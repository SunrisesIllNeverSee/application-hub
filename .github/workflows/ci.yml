name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  repo-standard:
    name: repo-standard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate repository structure
        run: python3 .repo/scripts/repo_check.py --ci
      - name: No unresolved merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ':!**/node_modules/**'; then
            echo "Unresolved merge-conflict markers found" >&2; exit 1
          fi

  migrations:
    name: Migration lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check migration names and duplicate numeric prefixes
        run: |
          python3 - << 'PYEOF'
          import os, sys, re
          from collections import defaultdict
          files = sorted(f for f in os.listdir('supabase/migrations') if f.endswith('.sql'))
          prefixes = defaultdict(list)
          invalid = []
          for f in files:
              m = re.match(r'^(\d+)_([a-z0-9_]+)\.sql$', f)
              if not m:
                  invalid.append(f)
              else:
                  prefixes[m.group(1)].append(f)
          duplicates = {k:v for k,v in prefixes.items() if len(v)>1}
          if invalid or duplicates:
              print('Invalid:', invalid)
              print('Duplicate prefixes:', duplicates)
              sys.exit(1)
          print(f'OK: {len(files)} migrations')
          PYEOF
      # From 059 on, a migration that creates a public table/sequence must
      # grant/revoke it explicitly and enable RLS (docs/MIGRATIONS.md).
      - name: Explicit Data API grants (migrations after 059)
        run: |
          python3 scripts/lint_migration_grants.py --self-test
          python3 scripts/lint_migration_grants.py

  db-local-suites:
    name: Local Postgres role-boundary suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # PostgreSQL 17 (production major; MAINTAIN privilege) + pgvector for
      # the full-chain grants runs (migration 001 creates extension vector).
      - name: Install PostgreSQL 17 + pgvector (PGDG)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17 postgresql-17-pgvector
      - name: Put Postgres server binaries on PATH
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql
          fi
          ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
      # Throwaway local clusters only (initdb in RUNNER_TEMP, loopback TCP);
      # these suites never connect to Supabase.
      - name: P0 suite (054/055 boundary)
        run: P0_PGROOT="$RUNNER_TEMP/p0" bash supabase/tests/p0/run_local.sh
      - name: M09 suite (058 catalog provenance + promotion, rollback)
        run: M09_PGROOT="$RUNNER_TEMP/m09" bash supabase/tests/m09/run_local.sh
      # Full chain 001 -> 059 on a fresh database; p0 + 058 + 50 grants
      # suites, rollback, and rebuild == production grants snapshot.
      - name: M09 full chain, pre-2026-10-30 default privileges
        run: GRANTS_MODE=default M09_PGBIN=/usr/lib/postgresql/17/bin M09_PGROOT="$RUNNER_TEMP/m09-default" bash supabase/tests/m09/run_local.sh
      - name: M09 full chain, revoked default privileges (Supabase 2026-10-30)
        run: GRANTS_MODE=revoked M09_PGBIN=/usr/lib/postgresql/17/bin M09_PGROOT="$RUNNER_TEMP/m09-revoked" bash supabase/tests/m09/run_local.sh

  mcp-server:
    name: MCP server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: application-hub-mcp-server
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application-hub-mcp-server/package-lock.json
      # aqua-mcp-server 2.0: zero-dependency ESM on the aqua-companion
      # (file:../aqua-companion). No build step; the package ships src/.
      - run: npm ci --ignore-scripts
      - name: TOOLS.json is generated from the registry and current
        run: npm run manifest:check
      - name: Hosted route's vendored catalog core matches src/catalog
        run: npm run vendor:hosted:check
      - name: Package's vendored companion matches aqua-companion
        run: npm run vendor:companion:check
      - name: npm pack file list has no local paths and no service-role string
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))[0]; const bad=p.files.filter(f=>/^\/|\.\.|node_modules|\.env|\.git/.test(f.path)); if(bad.length){console.error(bad);process.exit(1)}' "$RUNNER_TEMP/pack.json"
      - name: Tests (protocol, public tools, not_public, keys, workspace tiers, injection, manifest)
        run: npm test

  aqua-companion:
    name: AQUA companion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The agent interface runs on vendored copies of pure app modules
      # (aqua-companion/vendor/). Re-running the vendor script must change nothing.
      - name: Vendored app modules are in sync
        run: |
          node aqua-companion/scripts/vendor.mjs
          git diff --exit-code -- aqua-companion/vendor
          test -z "$(git status --porcelain -- aqua-companion/vendor)"
      # Zero dependencies. Tests import app/lib/aqua-local/*.ts via Node type stripping (Node 22.18+).
      - name: Companion tests
        run: node --test aqua-companion/test/*.test.mjs
      # M09b: the tarball the site serves (app/public/companion/) is rebuilt with
      # npm pack and must match; and it must run from an empty folder via npx.
      - name: Served companion tarball matches the source
        run: node aqua-companion/scripts/pack-site.mjs --check
      - name: Tarball runs via npx from an empty folder
        run: |
          tgz="$PWD/app/public/companion/$(node -p 'const l=require("./app/public/companion/latest.json"); l.url.split("/").pop()')"
          cd "$(mktemp -d)" && npx --yes "file:$tgz" --help | head -1
      # Agent guidance (llms.txt, llms-full.txt, /agents, /.well-known/mcp, /developers)
      # is generated from the tool registry; counts and install lines can never drift.
      - name: Agent guidance is generated from the registry
        run: node scripts/gen-agent-guidance.mjs --check

  next-app:
    name: Next.js app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Agent-readiness tests
        run: npm run test:agent
      - name: App unit tests (tests/*.test.mjs)
        run: npm run test:unit
      - name: Vault suites (aqua-local, session, score)
        run: npm run test:vault
      - name: Extension local-first tests
        run: npm run test:extension
      - name: Typecheck
        run: npm run type-check
      - name: Build
        run: npm run build
