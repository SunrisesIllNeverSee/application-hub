name: Publish MCP package

on:
  workflow_dispatch:
  push:
    tags:
      - 'mcp-v*'

permissions: {}

env:
  NODE_VERSION: '22'

jobs:
  publish-mcp:
    name: publish aqua-mcp-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      id-token: write # OIDC for npm trusted publishing + provenance
      contents: read
    defaults:
      run:
        working-directory: application-hub-mcp-server
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
      - name: Install + test
        run: |
          npm ci
          npm test
      - name: Upgrade npm for trusted publishing
        # Node's bundled npm is 10.x — OIDC trusted publishing requires >= 11.5.1.
        run: npm install -g npm@11.5.1
      - name: Publish to npm
        # Trusted-publisher OIDC: no NPM_TOKEN required when the
        # package's trusted publisher points at this workflow.
        run: npm publish --provenance --access public
